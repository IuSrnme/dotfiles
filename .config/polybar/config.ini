[colors]
background = #000000
foreground = #F7AABC
accent     = #E87FA0
dim        = #2d2d2d
blue       = #89b4d4
yellow     = #f0c060
module-bg  = #1a1a1a

[bar/main]
override-redirect = true
width = 98.5%
height = 28
offset-x = 0.75%
offset-y = 1%
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=10;3
padding-left = 2
padding-right = 2
module-margin = 1
modules-left = i3
modules-center = date
modules-right = cpu memory
border-size = 2
border-color = #FFF7AABC
wm-restack = i3

[module/i3]
type = internal/i3
format = <label-state>
label-focused = %index%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.module-bg}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 1
date = %A %d %b
time = %H:%M
label =  %date%   %time%
label-foreground = ${colors.foreground}
label-background = ${colors.module-bg}
label-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
label = 󰻠 %percentage%%
label-foreground = ${colors.blue}
label-background = ${colors.module-bg}
label-padding = 2

[module/memory]
type = internal/memory
interval = 2
label = 󰍛 %percentage_used%%
label-foreground = ${colors.yellow}
label-background = ${colors.module-bg}
label-padding = 2
