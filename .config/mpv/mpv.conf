# ============================================================
# mpv Config — sanny
# ============================================================

# --- Video ---
profile=gpu-hq
gpu-api=auto
hwdec=auto

# --- Audio ---
audio-channels=stereo
volume=100
volume-max=150

# --- Subtitles ---
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=40
sub-color="#F7AABC"
sub-border-color="#000000"
sub-border-size=2
sub-shadow-color="#000000"
sub-shadow-offset=1

# --- UI ---
osc=yes
osd-font="JetBrainsMono Nerd Font"
osd-font-size=32
osd-color="#F7AABC"
osd-border-color="#000000"
osd-border-size=2

# --- Behavior ---
loop-file=no
save-position-on-quit=yes
