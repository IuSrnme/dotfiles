# ============================================================
# kessoku.yazi/flavor.toml — sanny
# ============================================================

# --- Manager ---
[mgr]
cwd = { fg = "#F7AABC" }
find_keyword  = { fg = "#e9d985", bold = true }
find_position = { fg = "#f59bb1", bold = true }
marker_copied  = { fg = "#516aa1", bg = "#516aa1" }
marker_cut     = { fg = "#c75255", bg = "#c75255" }
marker_marked  = { fg = "#e9d985", bg = "#e9d985" }
marker_selected = { fg = "#f59bb1", bg = "#f59bb1" }
border_symbol = "│"
border_style  = { fg = "#2d2d2d" }

# --- Tabs ---
[tabs]
active   = { fg = "#000000", bg = "#f59bb1", bold = true }
inactive = { fg = "#F7AABC", bg = "#1a1a1a" }

# --- Mode ---
[mode]
normal_main = { fg = "#000000", bg = "#f59bb1", bold = true }
normal_alt  = { fg = "#f59bb1", bg = "#1a1a1a" }
select_main = { fg = "#000000", bg = "#e9d985", bold = true }
select_alt  = { fg = "#e9d985", bg = "#1a1a1a" }
unset_main  = { fg = "#000000", bg = "#516aa1", bold = true }
unset_alt   = { fg = "#516aa1", bg = "#1a1a1a" }

# --- Status ---
[status]
perm_type   = { fg = "#516aa1" }
perm_read   = { fg = "#e9d985" }
perm_write  = { fg = "#c75255" }
perm_exec   = { fg = "#f59bb1" }
perm_sep    = { fg = "#2d2d2d" }
progress_label  = { fg = "#F7AABC", bold = true }
progress_normal = { fg = "#f59bb1", bg = "#1a1a1a" }
progress_error  = { fg = "#c75255", bg = "#1a1a1a" }

# --- Which ---
[which]
cols = 3
mask = { bg = "#000000" }
cand = { fg = "#f59bb1" }
rest = { fg = "#2d2d2d" }
desc = { fg = "#F7AABC" }
separator       = " → "
separator_style = { fg = "#2d2d2d" }

# --- Input ---
[input]
border   = { fg = "#f59bb1" }
title    = { fg = "#F7AABC" }
value    = { fg = "#F7AABC" }
selected = { reversed = true }

# --- Confirm ---
[confirm]
border = { fg = "#f59bb1" }
title  = { fg = "#F7AABC" }

# --- Pick ---
[pick]
border   = { fg = "#f59bb1" }
active   = { fg = "#000000", bg = "#f59bb1" }
inactive = { fg = "#F7AABC" }

# --- Tasks ---
[tasks]
border = { fg = "#f59bb1" }
title  = { fg = "#F7AABC" }

# --- Notify ---
[notify]
title_info  = { fg = "#516aa1" }
title_warn  = { fg = "#e9d985" }
title_error = { fg = "#c75255" }

# --- Filetype ---
[filetype]
rules = [
  { mime = "image/*",        fg = "#f59bb1" },
  { mime = "{audio,video}/*", fg = "#e9d985" },
  { mime = "text/*",         fg = "#F7AABC" },
  { mime = "inode/empty",    fg = "#2d2d2d" },
  { url = "*", is = "orphan", fg = "#c75255" },
  { url = "*/",              fg = "#516aa1" },
]
